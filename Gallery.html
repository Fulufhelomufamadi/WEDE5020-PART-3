<script>
    //data and time update on the footer
    function updateDateTime() {
        const now = new Date();
        const option ={
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        };
        document.getElementById('date-time').textContent = now.toLocaleString('en-US', option);
    }
    //update date time immediately and then every second
    updateDateTime();
    setInterval(updateDateTime, 1000);
</script>
